spring.application.name=report_builder

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:h2:file:./${H2DB_DATABASE};DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${H2DB_USER}
spring.datasource.password=${H2DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

bot.token = ${TELEGRAM_BOT_TOKEN}